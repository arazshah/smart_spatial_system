// ─── BUILD DOM ───
const container = document.getElementById('mainContainer');
const navLinks = document.getElementById('navLinks');
let totalCheckboxes = 0;

phases.forEach((phase, idx) => {
// create details
const details = document.createElement('details');
details.className = 'phase';
details.id = `phase-${phase.id}`;

// summary
const summary = document.createElement('summary');
summary.innerHTML = `
<span class="phase-num">${phase.id}</span>
<span class="phase-title">${phase.title}</span>
<span class="phase-count" id="phaseCount_${phase.id}">0/0</span>
`;
details.appendChild(summary);

// body
const body = document.createElement('div');
body.className = 'phase-body';
body.innerHTML = phase.html;
details.appendChild(body);

container.appendChild(details);

// nav link
const a = document.createElement('a');
a.href = `#phase-${phase.id}`;
a.textContent = `${phase.id}. ${phase.title.replace(/<[^>]*>/g,'')}`;
navLinks.appendChild(a);

// count checkboxes in this phase
const chks = body.querySelectorAll('.checklist input[type="checkbox"]');
totalCheckboxes += chks.length;
});

// ─── STATE MANAGEMENT ───
const STORAGE_KEY = 'smart_spatial_checklist';

function loadState() {
try {
const raw = localStorage.getItem(STORAGE_KEY);
if (raw) return JSON.parse(raw);
} catch (_) { /* ignore */ }
return {};
}

function saveState(state) {
localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getCheckboxId(input) {
return input.getAttribute('data-id');
}

// apply saved state and set up listeners
const allInputs = document.querySelectorAll('.checklist input[type="checkbox"]');
const state = loadState();

allInputs.forEach(input => {
const id = getCheckboxId(input);
if (id && state[id] === true) {
input.checked = true;
} else if (id && state[id] === false) {
input.checked = false;
} else {
// default: use the 'checked' attribute from HTML
const wasChecked = input.hasAttribute('checked');
if (wasChecked) {
input.checked = true;
if (id) state[id] = true;
} else {
if (id) state[id] = false;
}
}
// update label class
updateLabelClass(input);

input.addEventListener('change', function(e) {
const cid = getCheckboxId(this);
if (cid) {
state[cid] = this.checked;
saveState(state);
updateLabelClass(this);
updateAllCounts();
}
});
});

// persist any defaults
saveState(state);

function updateLabelClass(input) {
const li = input.closest('li');
if (li) {
if (input.checked) {
li.classList.add('checked');
} else {
li.classList.remove('checked');
}
}
}

function countCompleted(phaseId) {
const phase = document.getElementById(`phase-${phaseId}`);
if (!phase) return [0, 0];
const inputs = phase.querySelectorAll('.checklist input[type="checkbox"]');
let done = 0;
inputs.forEach(inp => { if (inp.checked) done++; });
return [done, inputs.length];
}

function updateAllCounts() {
let totalDone = 0;
let totalAll = 0;
phases.forEach(p => {
const [done, all] = countCompleted(p.id);
totalDone += done;
totalAll += all;
const badge = document.getElementById(`phaseCount_${p.id}`);
if (badge) badge.textContent = `${done}/${all}`;
});
document.getElementById('progressCount').textContent = totalDone;
document.getElementById('totalCount').textContent = totalAll;
}

// initial count
updateAllCounts();

// ─── RESET ───
document.getElementById('resetAllBtn').addEventListener('click', function() {
if (!confirm('Reset all checkboxes? This cannot be undone.')) return;
const inputs = document.querySelectorAll('.checklist input[type="checkbox"]');
inputs.forEach(inp => {
inp.checked = false;
const id = getCheckboxId(inp);
if (id) state[id] = false;
updateLabelClass(inp);
});
saveState(state);
updateAllCounts();
});

// ─── SMOOTH SCROLL FOR NAV ───
document.querySelectorAll('.nav-links a').forEach(a => {
a.addEventListener('click', function(e) {
e.preventDefault();
const target = document.querySelector(this.getAttribute('href'));
if (target) {
target.scrollIntoView({ behavior: 'smooth', block: 'start' });
// open the details
if (target.tagName === 'DETAILS') target.open = true;
}
});
});

// ─── PRINT: open all details ───
window.addEventListener('beforeprint', function() {
document.querySelectorAll('details.phase').forEach(d => d.open = true);
});

})();
