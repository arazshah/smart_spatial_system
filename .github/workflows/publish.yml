name: Publish to PyPI

# Publishes smart_spatial_system to PyPI using Trusted Publishing (OIDC) -
# no API token is stored in this repository. See docs/PYPI_RELEASE_PLAN.md
# for the full release procedure, including the one-time PyPI setup and the
# hard prerequisite that geochat-sdk/geochat-kernel must be on PyPI first.
#
# One-time setup on pypi.org (done by the repository owner):
#   PyPI -> Account settings -> Publishing -> "Add a pending publisher"
#   (or the project's own Publishing tab once it exists), with:
#     Owner:            arazshah
#     Repository:       smart_spatial_system
#     Workflow name:    publish.yml
#     Environment name: pypi
#
# To release: push a tag like v0.1.0, or run this workflow manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check that no direct URL dependency slipped into the metadata
        # PyPI rejects uploads whose metadata carries a direct reference
        # (PEP 508 "name @ url"). requirements.txt still uses git+https for
        # the Docker/CI path, so this guards against that leaking into
        # pyproject.toml's dependencies.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = [n for n in z.namelist() if n.endswith("METADATA")][0]
              metadata = z.read(name).decode()
          offenders = [
              line
              for line in metadata.splitlines()
              if line.startswith("Requires-Dist:") and "@" in line
          ]
          if offenders:
              print("Direct URL dependencies found; PyPI will reject this:")
              print("\n".join(offenders))
              sys.exit(1)
          print("No direct URL dependencies in metadata.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
