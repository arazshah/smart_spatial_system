name: QGIS plugin

# Builds (and validates) the QGIS plugin zip; for tags qgis-plugin-vX.Y.Z also attaches it to a
# GitHub release. The headless-QGIS test job runs for plugin changes, manual runs and tags.
# Upload to plugins.qgis.org is manual, see docs/QGIS_PLUGIN.md.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build with --release (refuses placeholder metadata)"
        type: boolean
        default: false
  push:
    tags: ["qgis-plugin-v*"]
  pull_request:
    paths:
      - "qgis_plugin/**"
      - "scripts/package_qgis_plugin.py"
      - ".github/workflows/qgis-plugin.yml"

permissions:
  contents: read

jobs:
  headless-qgis-tests:
    name: Plugin tests in headless QGIS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS (apt) and a venv that can see it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-qgis qgis-providers python3-venv
          /usr/bin/python3.12 -m venv --system-site-packages .qvenv
          .qvenv/bin/pip install -e . pytest
          .qvenv/bin/pip install "numpy<2" "pandas<3" "geopandas<1.1"
      - name: Run the plugin tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .qvenv/bin/python -m pytest -q tests/test_qgis_plugin_processing.py tests/test_qgis_plugin_package.py

  package:
    name: Build plugin zip
    runs-on: ubuntu-latest
    needs: headless-qgis-tests
    permissions:
      contents: write   # attach the zip to a release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          RELEASE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.release }}" = "true" ]; then RELEASE="--release"; fi
          python scripts/package_qgis_plugin.py $RELEASE --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: s3geo-qgis-plugin
          path: dist/*.zip
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/qgis-plugin-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "S3Geo QGIS plugin ${TAG#qgis-plugin-v}. See docs/QGIS_PLUGIN.md."
          gh release upload "$TAG" dist/*.zip --clobber
