# Pinned, reproducible backend dependency set — generated from requirements.txt
# with `pip freeze` in a clean virtualenv. Regenerate with:
#
#   python -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r requirements.txt
#   /tmp/lockenv/bin/pip freeze | grep -v '^pip==' > requirements.lock
#
# requirements.txt stays the source of truth for direct/unpinned dependencies;
# this file pins the full resolved set (including the geochat-sdk/geochat-kernel
# git commit) for CI and reproducible installs. Use `pip install -r
# requirements.lock` when you want the exact versions this project was last
# validated against; use requirements.txt when intentionally picking up
# upstream updates, then regenerate this file.

